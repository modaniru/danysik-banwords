# Проверки и сборка образа в GHCR. Старый VPS удалён 21.11.2026.
# После сборки CI запускает точный digest через API Coolify и проверяет готовность.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/modaniru/banwords

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify && go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: make check
      - run: make test
      - run: python3 -m unittest discover -s ci -p 'test_deploy.py' -v

  image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/master' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy published digest and verify readiness
        run: python3 ci/deploy.py --manifest coolify.json
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          EXPECTED_IMAGE: ${{ env.IMAGE }}
